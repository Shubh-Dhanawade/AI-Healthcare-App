services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_ai}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-healthcare_user} -d $${POSTGRES_DB:-healthcare_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-healthcare_user}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-healthcare_ai}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OLLAMA_BASE_URL: http://ollama:11434
      # Q4_K_M quantization: ~2.5GB VRAM vs Q8_0's ~4GB
      # This allows ALL 35 transformer layers to fit on RTX 3050 (3.2GB free VRAM)
      # resulting in 40-50 tok/s GPU speed vs 8 tok/s CPU-spill speed.
      OLLAMA_MODEL: gemma3:4b-it-q4_K_M
      # 999 = force ALL layers to GPU. Ollama auto-clamps to available VRAM.
      OLLAMA_NUM_GPU: 999
      OLLAMA_KEEP_ALIVE: -1
      # Use only 4 CPU threads (reduces RAM pressure at 95% usage)
      OLLAMA_NUM_THREAD: 4
      QDRANT_HOST: qdrant
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 50
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost","http://127.0.0.1:3000"]}'
    volumes:
      - upload_data:/app/uploads
      - ./data_science_analysis:/app/data_science_analysis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - healthcare_network

  # Ollama AI Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: healthcare_ollama
    restart: unless-stopped
    environment:
      # Force Ollama to use ONLY the NVIDIA RTX 3050 (device 0), not AMD iGPU
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
      # Flash Attention: reduces VRAM used by attention mechanism by ~30%
      # This frees up space to fit more model layers on GPU
      OLLAMA_FLASH_ATTENTION: "1"
      # Store KV cache in q8_0 format instead of f16 — halves KV cache VRAM usage
      # f16 KV cache at num_ctx=1024: ~82 MiB → q8_0: ~41 MiB, freeing ~41 MiB extra
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      # Keep the model loaded indefinitely (no idle eviction)
      OLLAMA_KEEP_ALIVE: "-1"
      # Allow only 1 request at a time to avoid context-switching VRAM overhead
      OLLAMA_NUM_PARALLEL: "1"
      # Max queue depth — prevents pile-up during long inferences
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - healthcare_network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: healthcare_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - healthcare_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: healthcare_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - healthcare_network

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: healthcare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - healthcare_network

volumes:
  postgres_data:
  upload_data:
  ollama_data:
  qdrant_data:

networks:
  healthcare_network:
    driver: bridge
