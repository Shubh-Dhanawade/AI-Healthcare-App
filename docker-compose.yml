services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_ai}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-healthcare_user} -d $${POSTGRES_DB:-healthcare_ai}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-healthcare_user}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-healthcare_ai}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 525600
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:4b-it-q4_K_M
      # -1 = Ollama auto-fit: loads as many layers as possible into VRAM without GPU OOM
      OLLAMA_NUM_GPU: -1
      OLLAMA_KEEP_ALIVE: -1
      QDRANT_HOST: qdrant
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 50
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost","http://127.0.0.1:3000"]}'
    volumes:
      - upload_data:/app/uploads
      - ./data_science_analysis:/app/data_science_analysis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - healthcare_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Ollama AI Runtime (Disabled inside Docker to use Host's GPU-accelerated Ollama)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: healthcare_ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]
  #   # Increase shared memory to prevent OOM kills during concurrent LLM inference
  #   shm_size: '2gb'
  #   networks:
  #     - healthcare_network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: healthcare_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - healthcare_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: healthcare_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - healthcare_network

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: healthcare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - healthcare_network

volumes:
  postgres_data:
  upload_data:
  ollama_data:
  qdrant_data:

networks:
  healthcare_network:
    driver: bridge
